<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 -apple-system, Roboto, Arial, sans-serif; width: 270px; margin: 12px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; margin: 8px 0 3px; font-weight: 600; }
  select, input[type=range] { width: 100%; }
  .row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .row label { margin: 0; font-weight: normal; }
  #status { margin-top: 10px; font-size: 12px; color: #555; white-space: pre-wrap; }
  #status.err { color: #b00; }
  .hint { font-size: 11px; color: #777; margin-top: 10px; }
</style>
</head>
<body>
<h1>YT Dual Subs</h1>
<div class="row"><input type="checkbox" id="enabled"><label for="enabled">On</label></div>
<label for="model">Ollama model</label>
<select id="model"></select>
<label for="enMode">English line</label>
<select id="enMode">
  <option value="show">Show</option>
  <option value="blur">Blur until hover</option>
  <option value="hidden">Hide</option>
</select>
<label for="scale">Text size <span id="scaleVal"></span></label>
<input type="range" id="scale" min="0.6" max="1.6" step="0.1">
<div id="status"></div>
<div class="hint">Turn on CC and choose Swedish. Key <b>e</b> = show / blur / hide English. Click the Swedish line to replay it.</div>
<script src="popup.js"></script>
</body>
</html>
