<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, sans-serif">
<rect width="640" height="300" fill="#fff"/>
<line x1="320" y1="20" x2="320" y2="280" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/>
<text x="160" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">titta (på)</text>
<text x="160" y="64" text-anchor="middle" font-size="15" fill="#555">jag väljer att titta – aktivt</text>
<g transform="translate(60,130)">
<ellipse cx="0" cy="0" rx="32" ry="20" fill="#fff" stroke="#2b6cb0" stroke-width="3"/>
<circle cx="6" cy="0" r="11" fill="#2b6cb0"/><circle cx="9" cy="-3" r="3" fill="#fff"/>
</g>
<line x1="98" y1="130" x2="195" y2="130" stroke="#2b6cb0" stroke-width="3"/>
<polygon points="195,122 211,130 195,138" fill="#2b6cb0"/>
<rect x="222" y="95" width="70" height="50" rx="6" fill="#edf2f7" stroke="#555" stroke-width="3"/>
<rect x="232" y="105" width="50" height="30" fill="#90cdf4"/>
<line x1="245" y1="150" x2="269" y2="150" stroke="#555" stroke-width="3"/>
<text x="160" y="195" text-anchor="middle" font-size="18" fill="#222">Jag tittar <tspan font-weight="700">på</tspan> TV.</text>
<text x="160" y="225" text-anchor="middle" font-size="18" fill="#222">Titta på mig!</text>
<text x="160" y="255" text-anchor="middle" font-size="18" fill="#222">Vad tittar du på?</text>
<text x="480" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#2f855a">se</text>
<text x="480" y="64" text-anchor="middle" font-size="15" fill="#555">det kommer in i ögat – resultat</text>
<g transform="translate(380,130)">
<ellipse cx="0" cy="0" rx="32" ry="20" fill="#fff" stroke="#2f855a" stroke-width="3"/>
<circle cx="-6" cy="0" r="11" fill="#2f855a"/><circle cx="-3" cy="-3" r="3" fill="#fff"/>
</g>
<line x1="500" y1="130" x2="425" y2="130" stroke="#2f855a" stroke-width="3"/>
<polygon points="425,122 409,130 425,138" fill="#2f855a"/>
<circle cx="540" cy="115" r="14" fill="#c05621"/>
<ellipse cx="540" cy="148" rx="22" ry="18" fill="#c05621"/>
<polygon points="522,112 508,118 522,122" fill="#d69e2e"/>
<text x="480" y="195" text-anchor="middle" font-size="18" fill="#222">Jag <tspan font-weight="700">ser</tspan> en fågel.</text>
<text x="480" y="225" text-anchor="middle" font-size="18" fill="#222">Jag ser ingenting!</text>
<text x="480" y="255" text-anchor="middle" font-size="18" fill="#222">Har du sett min nyckel?</text>
</svg>
