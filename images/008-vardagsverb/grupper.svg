<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="system-ui, sans-serif">
<rect width="640" height="320" fill="#fff"/>
<text x="320" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#222">Tre sorters verb</text>
<g>
<rect x="15" y="50" width="195" height="250" rx="12" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="112" y="80" text-anchor="middle" font-size="19" font-weight="700" fill="#2b6cb0">1. -ar / -ade / -at</text>
<text x="112" y="104" text-anchor="middle" font-size="15" fill="#555">Regelbundna. Lätta!</text>
<text x="112" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#222">titta</text>
<text x="112" y="176" text-anchor="middle" font-size="16" fill="#2b6cb0">tittar · tittade · tittat</text>
<text x="112" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#222">gissa</text>
<text x="112" y="248" text-anchor="middle" font-size="16" fill="#2b6cb0">gissar · gissade · gissat</text>
<text x="112" y="283" text-anchor="middle" font-size="14" fill="#555">ändelse: ade / at</text>
</g>
<g>
<rect x="222" y="50" width="195" height="250" rx="12" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
<text x="320" y="80" text-anchor="middle" font-size="19" font-weight="700" fill="#c05621">2. -er / -te / -t</text>
<text x="320" y="104" text-anchor="middle" font-size="15" fill="#555">Regelbundna. Också lätta!</text>
<text x="320" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#222">försöka</text>
<text x="320" y="176" text-anchor="middle" font-size="14" fill="#c05621">försöker · försökte · försökt</text>
<text x="320" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#222">köpa</text>
<text x="320" y="248" text-anchor="middle" font-size="16" fill="#c05621">köper · köpte · köpt</text>
<text x="320" y="283" text-anchor="middle" font-size="14" fill="#555">ändelse: te / t</text>
</g>
<g>
<rect x="430" y="50" width="195" height="250" rx="12" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
<text x="527" y="80" text-anchor="middle" font-size="19" font-weight="700" fill="#c53030">3. Starka: ny vokal</text>
<text x="527" y="104" text-anchor="middle" font-size="15" fill="#555">Orden ändras inuti</text>
<text x="527" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#222">äta</text>
<text x="527" y="176" text-anchor="middle" font-size="16" fill="#c53030">äter · åt · ätit</text>
<text x="527" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#222">se</text>
<text x="527" y="248" text-anchor="middle" font-size="16" fill="#c53030">ser · såg · sett</text>
<text x="527" y="283" text-anchor="middle" font-size="14" fill="#555">ingen ade/te – ny vokal</text>
</g>
</svg>
