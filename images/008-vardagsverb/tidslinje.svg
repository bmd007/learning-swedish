<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, sans-serif">
<rect width="640" height="300" fill="#fff"/>
<text x="320" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#222">äta – äter – åt – ätit</text>
<line x1="30" y1="170" x2="605" y2="170" stroke="#555" stroke-width="3"/>
<polygon points="605,162 621,170 605,178" fill="#555"/>
<g fill="#fff" stroke="#555" stroke-width="3">
<circle cx="110" cy="115" r="30" fill="#fffaf0" stroke="#c05621"/>
<circle cx="260" cy="115" r="30" fill="#f0fff4" stroke="#6b46c1"/>
<circle cx="410" cy="115" r="30" fill="#f0fff4" stroke="#2f855a"/>
<circle cx="550" cy="115" r="30" fill="#f7fafc" stroke="#777" stroke-dasharray="5 4"/>
</g>
<g fill="#f6ad55"><circle cx="110" cy="115" r="14"/><circle cx="260" cy="115" r="14"/></g><g fill="#fff" stroke="#bbb" stroke-width="2"><circle cx="410" cy="115" r="14"/><circle cx="550" cy="115" r="14" stroke-dasharray="3 3"/></g>
<g stroke="#555" stroke-width="2" fill="none">
<line x1="110" y1="145" x2="110" y2="170"/><line x1="260" y1="145" x2="260" y2="170"/>
<line x1="410" y1="145" x2="410" y2="170"/><line x1="550" y1="145" x2="550" y2="170"/>
</g>
<text x="110" y="205" text-anchor="middle" font-size="26" font-weight="700" fill="#c05621">åt</text>
<text x="110" y="230" text-anchor="middle" font-size="15" fill="#555">igår (färdigt)</text>
<text x="260" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#6b46c1">har ätit</text>
<text x="260" y="230" text-anchor="middle" font-size="15" fill="#555">hittills / redan</text>
<text x="410" y="205" text-anchor="middle" font-size="26" font-weight="700" fill="#2f855a">äter</text>
<text x="410" y="230" text-anchor="middle" font-size="15" fill="#555">nu, varje dag</text>
<text x="550" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#555">ska äta</text>
<text x="550" y="230" text-anchor="middle" font-size="15" fill="#555">imorgon</text>
<text x="320" y="275" text-anchor="middle" font-size="17" fill="#222">Samma mönster: se – ser – såg – har sett</text>
</svg>
