<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui, Helvetica, Arial, sans-serif"><rect width="640" height="400" fill="#fff"/>
<g text-anchor="middle" fill="#222">
<text x="110" y="28" font-size="20" font-weight="bold">snabb – långsam</text>
<rect x="55" y="65" width="100" height="32" rx="10" fill="#3b7dd8"/><rect x="75" y="48" width="55" height="25" rx="8" fill="#3b7dd8"/><circle cx="78" cy="100" r="11" fill="#333"/><circle cx="135" cy="100" r="11" fill="#333"/><path d="M15 70 h30 M10 82 h35 M20 94 h25" stroke="#888" stroke-width="3"/>
<text x="110" y="140" font-size="18">en <tspan font-weight="bold">snabb</tspan> bil</text>
<ellipse cx="105" cy="215" rx="45" ry="22" fill="#8fb18c"/><circle cx="105" cy="195" r="26" fill="#c98b4e"/><circle cx="105" cy="195" r="14" fill="none" stroke="#8a5a2b" stroke-width="3"/><circle cx="157" cy="205" r="9" fill="#8fb18c"/>
<text x="110" y="268" font-size="18">en <tspan font-weight="bold">långsam</tspan> snigel</text>
<text x="320" y="28" font-size="20" font-weight="bold">lätt – svår</text>
<rect x="240" y="50" width="160" height="80" rx="8" fill="#e3f5e8" stroke="#2e9e4f" stroke-width="3"/><text x="320" y="100" font-size="32" font-weight="bold" fill="#2e9e4f">2 + 2 = 4</text>
<text x="320" y="156" font-size="18">ett <tspan font-weight="bold">lätt</tspan> prov</text>
<rect x="240" y="190" width="160" height="80" rx="8" fill="#fde3e3" stroke="#c0392b" stroke-width="3"/><text x="320" y="240" font-size="28" font-weight="bold" fill="#c0392b">x² + 7x = ?</text>
<text x="320" y="296" font-size="18">ett <tspan font-weight="bold">svårt</tspan> prov</text>
<text x="530" y="28" font-size="20" font-weight="bold">glad – ledsen</text>
<circle cx="530" cy="85" r="40" fill="#ffe27a" stroke="#c9a200" stroke-width="3"/><circle cx="516" cy="75" r="5" fill="#333"/><circle cx="544" cy="75" r="5" fill="#333"/><path d="M510 95 q20 22 40 0" fill="none" stroke="#333" stroke-width="4"/>
<text x="530" y="150" font-size="18">hon är <tspan font-weight="bold">glad</tspan></text><text x="530" y="171" font-size="18">de är <tspan font-weight="bold">glada</tspan></text>
<circle cx="530" cy="225" r="40" fill="#cfe6fa" stroke="#3b7dd8" stroke-width="3"/><circle cx="516" cy="215" r="5" fill="#333"/><circle cx="544" cy="215" r="5" fill="#333"/><path d="M510 245 q20 -20 40 0" fill="none" stroke="#333" stroke-width="4"/><path d="M544 225 q-4 14 0 20" stroke="#3b7dd8" stroke-width="5" fill="none"/>
<text x="530" y="290" font-size="18">han är <tspan font-weight="bold">ledsen</tspan></text><text x="530" y="311" font-size="18">de är <tspan font-weight="bold">ledsna</tspan></text>
<rect x="20" y="325" width="600" height="60" rx="10" fill="#fff8e1" stroke="#e0b100" stroke-width="2"/>
<text x="320" y="350" font-size="17">Slutar ordet på -tt? Då är det samma: lätt – lätt (ett lätt prov).</text>
<text x="320" y="372" font-size="17">glad → glatt (d blir tt). ledsen → ledset, ledsna.</text>
</g></svg>
