<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="system-ui, Helvetica, Arial, sans-serif"><rect width="640" height="320" fill="#fff"/>
<text x="320" y="30" font-size="22" text-anchor="middle" font-weight="bold" fill="#222">Substantivet bestämmer adjektivet</text>
<g text-anchor="middle" font-size="18" fill="#222">
<rect x="15" y="50" width="145" height="170" rx="12" fill="#e8f1fb" stroke="#3b7dd8" stroke-width="3"/>
<text x="87" y="78" font-weight="bold" fill="#3b7dd8">en-ord</text>
<text x="87" y="115">en <tspan font-weight="bold">gammal</tspan></text><text x="87" y="140">lägenhet</text>
<text x="87" y="185" font-size="26" font-weight="bold" fill="#3b7dd8">–</text>
<rect x="175" y="50" width="145" height="170" rx="12" fill="#e9f7ec" stroke="#2e9e4f" stroke-width="3"/>
<text x="247" y="78" font-weight="bold" fill="#2e9e4f">ett-ord</text>
<text x="247" y="115">ett <tspan font-weight="bold">gammalt</tspan></text><text x="247" y="140">hem</text>
<text x="247" y="185" font-size="26" font-weight="bold" fill="#2e9e4f">-t</text>
<rect x="335" y="50" width="145" height="170" rx="12" fill="#fdf0e3" stroke="#e08a1e" stroke-width="3"/>
<text x="407" y="78" font-weight="bold" fill="#e08a1e">flera</text>
<text x="407" y="115"><tspan font-weight="bold">gamla</tspan></text><text x="407" y="140">lägenheter</text>
<text x="407" y="185" font-size="26" font-weight="bold" fill="#e08a1e">-a</text>
<rect x="495" y="50" width="130" height="170" rx="12" fill="#f3e8fb" stroke="#8e44ad" stroke-width="3"/>
<text x="560" y="78" font-weight="bold" fill="#8e44ad">bestämd</text>
<text x="560" y="115">den <tspan font-weight="bold">gamla</tspan></text><text x="560" y="140">lägenheten</text>
<text x="560" y="185" font-size="26" font-weight="bold" fill="#8e44ad">-a</text>
</g>
<rect x="15" y="238" width="610" height="68" rx="10" fill="#fff8e1" stroke="#e0b100" stroke-width="2"/>
<text x="320" y="266" font-size="18" text-anchor="middle" fill="#222">Hook: ett-ord = <tspan font-weight="bold">t</tspan>.  en lägenhet – <tspan font-weight="bold">min</tspan>,  ett hem – <tspan font-weight="bold">mitt</tspan>,  flera – <tspan font-weight="bold">mina</tspan></text>
<text x="320" y="292" font-size="16" text-anchor="middle" fill="#555">Lär dig substantivet med artikeln: ett hem, ett rum, en lägenhet.</text>
</svg>
