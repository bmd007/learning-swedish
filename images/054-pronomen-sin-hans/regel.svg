<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300"><rect width="600" height="300" fill="#ffffff"/>
<text x="300" y="34" font-size="22" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">sin – sitt – sina: som min – mitt – mina</text>
<text x="100" y="100" font-size="20" fill="#555" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">en-ord</text>
<text x="300" y="100" font-size="20" fill="#555" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">ett-ord</text>
<text x="500" y="100" font-size="20" fill="#555" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">flera</text>
<rect x="20" y="115" width="160" height="70" rx="10" fill="#e8f0fb" stroke="#1a5fb4" stroke-width="2"/><rect x="220" y="115" width="160" height="70" rx="10" fill="#e8f0fb" stroke="#1a5fb4" stroke-width="2"/><rect x="420" y="115" width="160" height="70" rx="10" fill="#e8f0fb" stroke="#1a5fb4" stroke-width="2"/>
<text x="100" y="158" font-size="28" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">sin bil</text>
<text x="300" y="158" font-size="28" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">sitt hus</text>
<text x="500" y="158" font-size="28" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">sina barn</text>
<text x="300" y="225" font-size="20" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">Han tar sin bil. Hon älskar sitt jobb. De bjuder sina vänner.</text>
<text x="300" y="265" font-size="17" fill="#666" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">Ägaren är samma person som den som gör något (subjektet).</text>
</svg>
