<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300"><rect width="600" height="300" fill="#ffffff"/><text x="300" y="28" font-size="20" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">Gör substantivet verbet?</text><rect x="20" y="50" width="260" height="215" rx="10" fill="#e8f0fb" stroke="#1a5fb4" stroke-width="2"/><text x="150" y="80" font-size="18" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">JA: som + verb</text><text x="150" y="108" font-size="16" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">en intervju</text><text x="150" y="136" font-size="18" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">som började</text><text x="150" y="164" font-size="16" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">klockan 8.30</text><text x="150" y="192" font-size="14" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">inget extra subjekt</text><text x="150" y="220" font-size="13" fill="#a00" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">(inte: som det började)</text><rect x="320" y="50" width="260" height="215" rx="10" fill="#e6f4e9" stroke="#2a7a3b" stroke-width="2"/><text x="450" y="80" font-size="18" fill="#2a7a3b" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">NEJ: som + subjekt + verb</text><text x="450" y="108" font-size="16" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">en film</text><text x="450" y="136" font-size="18" fill="#2a7a3b" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">som jag såg</text><text x="450" y="164" font-size="13" fill="#a00" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">(inte: som jag såg den)</text><text x="450" y="192" font-size="14" fill="#2a7a3b" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">någon annan gör verbet</text><text x="450" y="220" font-size="14" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold"></text></svg>