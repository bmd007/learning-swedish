<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif"><rect width="600" height="300" fill="#fff"/>
<text x="300" y="28" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Mobilen: för och emot</text>
<line x1="300" y1="120" x2="300" y2="270" stroke="#555" stroke-width="6"/><rect x="230" y="266" width="140" height="14" rx="4" fill="#555"/>
<line x1="90" y1="120" x2="510" y2="120" stroke="#555" stroke-width="6"/>
<rect x="40" y="128" width="200" height="110" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="140" y="152" font-size="18" font-weight="bold" text-anchor="middle" fill="#166534">Å ena sidan</text>
<g font-size="16" fill="#222" text-anchor="middle"><text x="140" y="180">ringa familjen</text><text x="140" y="204">lära sig svenska</text><text x="140" y="228">billigare, snabbare</text></g>
<rect x="360" y="128" width="200" height="110" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="460" y="152" font-size="18" font-weight="bold" text-anchor="middle" fill="#991b1b">Å andra sidan</text>
<g font-size="16" fill="#222" text-anchor="middle"><text x="460" y="180">sitter för mycket</text><text x="460" y="204">trött på jobbet</text><text x="460" y="228">ingen pratar</text></g>
<text x="300" y="62" font-size="17" text-anchor="middle" fill="#222">Det beror på hur mycket man använder den.</text>
<text x="300" y="90" font-size="17" text-anchor="middle" fill="#222">Visa båda sidorna – sen säg vad du tycker.</text>
</svg>
