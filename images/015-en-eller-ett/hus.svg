<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#ffffff"/>
  <polygon points="40,110 250,20 460,110" fill="#f5b7b1" stroke="#922b21" stroke-width="3"/>
  <text x="250" y="85" text-anchor="middle" font-size="20" font-weight="bold" fill="#922b21">ett hus</text>
  <rect x="60" y="110" width="380" height="190" fill="#fdf2f0" stroke="#922b21" stroke-width="3"/>
  <line x1="250" y1="110" x2="250" y2="300" stroke="#922b21" stroke-width="2"/>
  <line x1="60" y1="205" x2="440" y2="205" stroke="#922b21" stroke-width="2"/>
  <g font-size="19" font-weight="bold" fill="#922b21" text-anchor="middle">
    <text x="155" y="165">ett kök</text>
    <text x="345" y="165">ett badrum</text>
    <text x="155" y="260">ett sovrum</text>
    <text x="345" y="260">ett fönster</text>
  </g>
  <text x="250" y="294" text-anchor="middle" font-size="14" fill="#922b21">ett golv · ett hem · ett rum</text>
  <text x="550" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a5276">en-ord</text>
  <g font-size="19" fill="#1a5276" font-weight="bold">
    <rect x="470" y="60" width="160" height="38" rx="8" fill="#d6eaf8"/><text x="550" y="86" text-anchor="middle">en lägenhet</text>
    <rect x="470" y="108" width="160" height="38" rx="8" fill="#d6eaf8"/><text x="550" y="134" text-anchor="middle">en dörr</text>
    <rect x="470" y="156" width="160" height="38" rx="8" fill="#d6eaf8"/><text x="550" y="182" text-anchor="middle">en balkong</text>
    <rect x="470" y="204" width="160" height="38" rx="8" fill="#d6eaf8"/><text x="550" y="230" text-anchor="middle">en soffa</text>
    <rect x="470" y="252" width="160" height="38" rx="8" fill="#d6eaf8"/><text x="550" y="278" text-anchor="middle">en hyra</text>
  </g>
</svg>
