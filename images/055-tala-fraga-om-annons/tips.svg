<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300"><rect width="600" height="300" fill="#ffffff"/>
<text x="300" y="35" font-size="22" font-weight="bold" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif">Tipsrutan: gör varje tips till en fråga</text>
<rect x="150" y="60" width="300" height="190" rx="12" fill="#e8f0fb" stroke="#1a5fb4" stroke-width="3"/>
<text x="300" y="95" font-size="18" font-weight="bold" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif">TIPS</text>
<text x="300" y="130" font-size="18" text-anchor="middle" fill="#222" font-family="system-ui, sans-serif">1. tips  →  fråga</text>
<text x="300" y="160" font-size="18" text-anchor="middle" fill="#222" font-family="system-ui, sans-serif">2. tips  →  fråga</text>
<text x="300" y="190" font-size="18" text-anchor="middle" fill="#222" font-family="system-ui, sans-serif">3. tips  →  fråga</text>
<text x="300" y="225" font-size="18" text-anchor="middle" fill="#2a7d2a" font-weight="bold" font-family="system-ui, sans-serif">+ egen fråga. Tack, då vet jag allt.</text>
