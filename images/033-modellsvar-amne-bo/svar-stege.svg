<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif"><rect width="600" height="300" fill="#fff"/>
<text x="300" y="26" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Svarsstegen – fem steg</text>
<g font-size="17" fill="#222">
<rect x="20" y="42" width="560" height="44" rx="8" fill="#dbeafe"/><text x="34" y="70"><tspan font-weight="bold">1 Åsikt:</tspan> Jag tycker att det är bättre att bo i stan.</text>
<rect x="20" y="92" width="560" height="44" rx="8" fill="#dcfce7"/><text x="34" y="120"><tspan font-weight="bold">2 Skäl:</tspan> Det är nära till allt. Därför behöver jag ingen bil.</text>
<rect x="20" y="142" width="560" height="44" rx="8" fill="#fef9c3"/><text x="34" y="170"><tspan font-weight="bold">3 Exempel:</tspan> Förra året bodde jag hos min moster …</text>
<rect x="20" y="192" width="560" height="44" rx="8" fill="#fee2e2"/><text x="34" y="220"><tspan font-weight="bold">4 Andra sidan:</tspan> Å andra sidan är det dyrare.</text>
<rect x="20" y="242" width="560" height="44" rx="8" fill="#f3e8ff"/><text x="34" y="270"><tspan font-weight="bold">5 Fråga tillbaka:</tspan> Vad tycker du själv?</text>
</g></svg>
