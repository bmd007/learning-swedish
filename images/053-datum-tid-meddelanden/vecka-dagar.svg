<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="system-ui, sans-serif"><rect width="640" height="280" fill="#fff"/><text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Idag är det onsdag</text><rect x="15" y="60" width="83" height="70" rx="8" fill="#e3f2fd" stroke="#555"/><text x="56" y="102" text-anchor="middle" font-size="16" fill="#222">måndag</text><text x="56" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">förrgår</text><text x="56" y="190" text-anchor="middle" font-size="14" fill="#555">پریروز</text><rect x="104" y="60" width="83" height="70" rx="8" fill="#e3f2fd" stroke="#555"/><text x="145" y="102" text-anchor="middle" font-size="16" fill="#222">tisdag</text><text x="145" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">i går</text><text x="145" y="190" text-anchor="middle" font-size="14" fill="#555">دیروز</text><rect x="193" y="60" width="83" height="70" rx="8" fill="#ffd54f" stroke="#555"/><text x="234" y="102" text-anchor="middle" font-size="16" fill="#222">onsdag</text><text x="234" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">i dag</text><text x="234" y="190" text-anchor="middle" font-size="14" fill="#555">امروز</text><rect x="282" y="60" width="83" height="70" rx="8" fill="#e3f2fd" stroke="#555"/><text x="323" y="102" text-anchor="middle" font-size="16" fill="#222">torsdag</text><text x="323" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">i morgon</text><text x="323" y="190" text-anchor="middle" font-size="14" fill="#555">فردا</text><rect x="371" y="60" width="83" height="70" rx="8" fill="#e3f2fd" stroke="#555"/><text x="412" y="102" text-anchor="middle" font-size="16" fill="#222">fredag</text><text x="412" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">i övermorgon</text><text x="412" y="190" text-anchor="middle" font-size="14" fill="#555">پس‌فردا</text><rect x="460" y="60" width="83" height="70" rx="8" fill="#eee" stroke="#555"/><text x="501" y="102" text-anchor="middle" font-size="16" fill="#222">lördag</text><rect x="549" y="60" width="83" height="70" rx="8" fill="#eee" stroke="#555"/><text x="590" y="102" text-anchor="middle" font-size="16" fill="#222">söndag</text><text x="320" y="240" text-anchor="middle" font-size="16" fill="#222">på fredag = nästa fredag · i fredags = förra fredagen · på fredagar = varje fredag</text></svg>