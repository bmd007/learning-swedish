<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="system-ui, sans-serif"><rect width="640" height="280" fill="#fff"/><rect x="20" y="50" width="190" height="90" rx="10" fill="#e3f2fd" stroke="#555"/><text x="115" y="90" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">förra veckan</text><text x="115" y="120" text-anchor="middle" font-size="15" fill="#444">för en vecka sedan</text><rect x="225" y="50" width="190" height="90" rx="10" fill="#ffd54f" stroke="#555"/><text x="320" y="90" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">den här veckan</text><text x="320" y="120" text-anchor="middle" font-size="15" fill="#444">i veckan</text><rect x="430" y="50" width="190" height="90" rx="10" fill="#c8e6c9" stroke="#555"/><text x="525" y="90" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">nästa vecka</text><text x="525" y="120" text-anchor="middle" font-size="15" fill="#444">om en vecka</text><text x="320" y="30" text-anchor="middle" font-size="18" fill="#222">en vecka – veckan – veckor – veckorna</text><line x1="20" y1="175" x2="620" y2="175" stroke="#c62828" stroke-width="3"/><text x="320" y="205" text-anchor="middle" font-size="18" fill="#c62828">varje vecka = alla veckor</text><text x="320" y="245" text-anchor="middle" font-size="16" fill="#222">vecka 50 · två veckor · de två veckorna · tre gånger i veckan</text></svg>