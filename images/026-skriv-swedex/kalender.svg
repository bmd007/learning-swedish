<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" font-family="system-ui, sans-serif">
  <rect width="700" height="220" fill="#fff"/>
  <text x="350" y="28" font-size="20" font-weight="700" text-anchor="middle" fill="#222">December – din kalender</text>
  <g font-size="16" text-anchor="middle" fill="#222">
    <rect x="15" y="50" width="125" height="150" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="2"/>
    <text x="77" y="78" font-weight="700">mån 7</text><text x="77" y="150" font-size="34">&#x1F9B7;</text>
    <rect x="145" y="50" width="125" height="150" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="2"/>
    <text x="207" y="78" font-weight="700">ons 9</text><text x="207" y="150" font-size="34">&#x1F3CA;</text>
    <rect x="275" y="50" width="150" height="150" rx="8" fill="#fefcbf" stroke="#d69e2e" stroke-width="4"/>
    <text x="350" y="78" font-weight="700">tors 10 – i dag</text><text x="350" y="150" font-size="34">&#x1F4BC; &#x1F9F9;</text>
    <rect x="430" y="50" width="125" height="150" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="2"/>
    <text x="492" y="78" font-weight="700">fre 11</text><text x="492" y="150" font-size="34">&#x1F382;</text>
    <rect x="560" y="50" width="125" height="150" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="2"/>
    <text x="622" y="78" font-weight="700">lör 12</text><text x="622" y="150" font-size="34">&#x1F686;</text>
  </g>
</svg>
