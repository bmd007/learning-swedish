<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, Helvetica, Arial, sans-serif"><rect width="600" height="300" fill="#fff"/><text x="300" y="34" font-size="24" text-anchor="middle" fill="#222" font-weight="bold">Person eller sak?</text><rect x="30" y="60" width="255" height="200" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="3"/><text x="157" y="95" font-size="18" text-anchor="middle" fill="#c0392b" font-weight="bold">PERSON</text><text x="157" y="150" font-size="30" text-anchor="middle" fill="#222" font-weight="bold">stressad</text><text x="157" y="190" font-size="20" text-anchor="middle" fill="#222">Hon är stressad.</text><text x="157" y="225" font-size="16" text-anchor="middle" fill="#555">(hon känner stress)</text><rect x="315" y="60" width="255" height="200" rx="12" fill="#e8f1fb" stroke="#3b7dd8" stroke-width="3"/><text x="442" y="95" font-size="18" text-anchor="middle" fill="#3b7dd8" font-weight="bold">SAK / SITUATION</text><text x="442" y="150" font-size="30" text-anchor="middle" fill="#222" font-weight="bold">stressig</text><text x="442" y="190" font-size="18" text-anchor="middle" fill="#222">Det är ett stressigt jobb.</text><text x="442" y="225" font-size="16" text-anchor="middle" fill="#555">(jobbet ger stress)</text></svg>