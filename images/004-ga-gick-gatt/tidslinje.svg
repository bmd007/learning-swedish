<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <line x1="40" y1="200" x2="600" y2="200" stroke="#555" stroke-width="3"/>
  <polygon points="600,192 616,200 600,208" fill="#555"/>
  <g id="walker">
    <circle cx="0" cy="-70" r="11" fill="#2b6cb0"/>
    <line x1="0" y1="-58" x2="0" y2="-25" stroke="#2b6cb0" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="-50" x2="-14" y2="-36" stroke="#2b6cb0" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-50" x2="14" y2="-38" stroke="#2b6cb0" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-25" x2="-13" y2="0" stroke="#2b6cb0" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="-25" x2="13" y2="0" stroke="#2b6cb0" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g transform="translate(120,196)" opacity="0.55"><use href="#walker"/></g>
  <g transform="translate(320,196)"><use href="#walker"/></g>
  <g transform="translate(510,196)" opacity="0.35" stroke-dasharray="4 4"><circle cx="0" cy="-70" r="11" fill="none" stroke="#2b6cb0" stroke-width="2"/></g>
  <circle cx="120" cy="200" r="6" fill="#c05621"/>
  <circle cx="320" cy="200" r="6" fill="#2f855a"/>
  <rect x="210" y="186" width="10" height="28" fill="#6b46c1" rx="2"/>
  <text x="120" y="240" text-anchor="middle" font-size="26" font-weight="700" fill="#c05621">gick</text>
  <text x="120" y="266" text-anchor="middle" font-size="16" fill="#555">igår, i fredags</text>
  <text x="320" y="240" text-anchor="middle" font-size="26" font-weight="700" fill="#2f855a">går</text>
  <text x="320" y="266" text-anchor="middle" font-size="16" fill="#555">nu, varje dag</text>
  <text x="215" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#6b46c1">har gått</text>
  <text x="215" y="288" text-anchor="middle" font-size="16" fill="#555">(fram till nu)</text>
  <text x="510" y="240" text-anchor="middle" font-size="22" font-weight="700" fill="#555">ska gå</text>
  <text x="510" y="266" text-anchor="middle" font-size="16" fill="#555">imorgon</text>
  <text x="320" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#222">gå – går – gick – gått</text>
</svg>
