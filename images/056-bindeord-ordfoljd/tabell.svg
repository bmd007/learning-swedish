<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300"><rect width="600" height="300" fill="#ffffff"/>
<text x="300" y="26" font-size="20" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">Fyra grupper: vad kommer efter ordet?</text><rect x="10" y="40" width="280" height="120" rx="10" fill="#e8f0fb" stroke="#1a5fb4" stroke-width="2"/><text x="150" y="66" font-size="17" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">1 Verb direkt efter</text><text x="150" y="94" font-size="14" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">därför, sedan, då, nu,</text><text x="150" y="114" font-size="14" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">dessutom, ändå, tyvärr, alltså</text><text x="150" y="142" font-size="15" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">→ ordet + verb + jag</text><rect x="310" y="40" width="280" height="120" rx="10" fill="#fdeee0" stroke="#c64600" stroke-width="2"/><text x="450" y="66" font-size="17" fill="#c64600" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">2 Vanlig ordning</text><text x="450" y="94" font-size="14" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">och, men, eller, så, för</text><text x="450" y="114" font-size="14" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">(= för att/eftersom)</text><text x="450" y="142" font-size="15" fill="#c64600" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">→ jag + verb (som vanligt)</text><rect x="10" y="170" width="280" height="120" rx="10" fill="#e6f4e9" stroke="#2a7a3b" stroke-width="2"/><text x="150" y="196" font-size="17" fill="#2a7a3b" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">3 Bisats</text><text x="150" y="224" font-size="14" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">att, eftersom, när, om, innan,</text><text x="150" y="244" font-size="14" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">medan, fast, även om, som, så att</text><text x="150" y="272" font-size="15" fill="#2a7a3b" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">→ jag + inte + verb</text><rect x="310" y="170" width="280" height="120" rx="10" fill="#f3e6f3" stroke="#7a2a7a" stroke-width="2"/><text x="450" y="196" font-size="17" fill="#7a2a7a" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">4 Syfte: för att + infinitiv</text><text x="450" y="224" font-size="14" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">för att + verb (ingen subjekt)</text><text x="450" y="244" font-size="14" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">Jag åker för att hälsa på.</text><text x="450" y="272" font-size="15" fill="#7a2a7a" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">→ för att + hälsa</text>
</svg>
