<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300"><rect width="600" height="300" fill="#ffffff"/>
<text x="300" y="28" font-size="20" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">att är växeln</text><rect x="20" y="50" width="260" height="200" rx="10" fill="#e8f0fb" stroke="#1a5fb4" stroke-width="2"/><text x="150" y="80" font-size="18" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">därför</text><text x="150" y="112" font-size="16" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">Jag hade ont,</text><text x="150" y="140" font-size="18" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">därför gick jag</text><text x="150" y="166" font-size="16" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">till tandläkaren.</text><text x="150" y="205" font-size="14" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">verb direkt efter ordet</text><text x="150" y="228" font-size="14" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">= that's why</text><rect x="320" y="50" width="260" height="200" rx="10" fill="#e6f4e9" stroke="#2a7a3b" stroke-width="2"/><text x="450" y="80" font-size="18" fill="#2a7a3b" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">därför att</text><text x="450" y="112" font-size="16" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">Jag gick till tandläkaren,</text><text x="450" y="140" font-size="18" fill="#2a7a3b" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">därför att jag hade ont.</text><text x="450" y="166" font-size="16" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">(bisats)</text><text x="450" y="205" font-size="14" fill="#2a7a3b" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">jag + verb (+ inte före verbet)</text><text x="450" y="228" font-size="14" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">= eftersom</text><text x="300" y="280" font-size="15" fill="#666" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">Ordet står först i meningen och drar verbet efter sig? Grupp 1.</text>
</svg>
