<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="system-ui, sans-serif">
  <rect width="700" height="330" fill="#fff"/>
  <g font-size="15" text-anchor="middle" fill="#222">
    <text x="350" y="28" font-size="20" font-weight="700">Det är måndag i dag</text>
    <g transform="translate(18,45)">
      <rect x="0" y="0" width="75" height="70" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="3"/>
      <text x="37" y="24" font-weight="700">fre</text><text x="37" y="50" font-size="13" fill="#c53030" font-weight="700">i fredags</text>
      <rect x="80" y="0" width="75" height="70" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="2"/><text x="117" y="24">lör</text>
      <rect x="160" y="0" width="75" height="70" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="2"/><text x="197" y="24">sön</text>
      <rect x="240" y="0" width="75" height="70" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="3"/>
      <text x="277" y="24" font-weight="700">mån</text><text x="277" y="50" font-size="13" fill="#2f855a" font-weight="700">i dag</text>
      <rect x="320" y="0" width="75" height="70" rx="8" fill="#bee3f8" stroke="#2b6cb0" stroke-width="3"/>
      <text x="357" y="24" font-weight="700">tis</text><text x="357" y="50" font-size="13" fill="#2b6cb0" font-weight="700">i morgon</text>
      <rect x="400" y="0" width="75" height="70" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="2"/><text x="437" y="24">ons</text>
      <rect x="480" y="0" width="75" height="70" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="2"/><text x="517" y="24">tor</text>
      <rect x="560" y="0" width="75" height="70" rx="8" fill="#bee3f8" stroke="#2b6cb0" stroke-width="3"/>
      <text x="597" y="24" font-weight="700">fre</text><text x="597" y="50" font-size="13" fill="#2b6cb0" font-weight="700">på fredag</text>
    </g>
  </g>
  <g transform="translate(40,150)">
    <circle cx="60" cy="70" r="36" fill="#f6ad55"/>
    <rect x="0" y="70" width="120" height="50" fill="#fff"/>
    <line x1="0" y1="70" x2="120" y2="70" stroke="#2d3748" stroke-width="3"/>
    <g stroke="#f6ad55" stroke-width="4" stroke-linecap="round"><line x1="60" y1="20" x2="60" y2="8"/><line x1="20" y1="40" x2="10" y2="32"/><line x1="100" y1="40" x2="110" y2="32"/></g>
    <text x="60" y="105" text-anchor="middle" font-size="18" font-weight="700" fill="#c05621">i morse</text>
    <text x="60" y="128" text-anchor="middle" font-size="14" fill="#555">i dag tidigt – slut</text>
  </g>
  <g transform="translate(220,150)">
    <circle cx="60" cy="48" r="28" fill="#f6e05e"/>
    <path d="M10 95 Q60 75 110 95" fill="#f6e05e" stroke="#d69e2e" stroke-width="2"/>
    <rect x="80" y="20" width="6" height="60" fill="#8b5a2b"/><path d="M83 20 L60 32 L106 32 Z" fill="#e53e3e"/>
    <text x="60" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#c05621">i somras</text>
    <text x="60" y="142" text-anchor="middle" font-size="14" fill="#555">förra sommaren</text>
  </g>
  <g transform="translate(400,150)">
    <path d="M60 10 L95 70 L25 70 Z" fill="#2f855a"/><path d="M60 40 L105 105 L15 105 Z" fill="#276749"/>
    <rect x="54" y="105" width="12" height="14" fill="#8b5a2b"/>
    <circle cx="60" cy="10" r="6" fill="#f6e05e"/><circle cx="45" cy="60" r="5" fill="#e53e3e"/><circle cx="75" cy="85" r="5" fill="#3182ce"/>
    <text x="60" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#2b6cb0">i jul</text>
    <text x="60" y="160" text-anchor="middle" font-size="14" fill="#555">nästa jul (i julas = förra)</text>
  </g>
  <g transform="translate(570,150)">
    <rect x="10" y="20" width="100" height="80" rx="8" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
    <rect x="10" y="20" width="100" height="22" fill="#2b6cb0"/>
    <text x="60" y="80" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">+7</text>
    <text x="60" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#2b6cb0">nästa vecka</text>
  </g>
</svg>
