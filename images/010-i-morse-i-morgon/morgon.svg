<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" font-family="system-ui, sans-serif">
  <rect width="680" height="280" fill="#fff"/>
  <g transform="translate(20,40)">
    <rect width="300" height="180" rx="14" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
    <circle cx="60" cy="60" r="26" fill="#f6ad55"/>
    <rect x="120" y="70" width="150" height="60" rx="14" fill="#3182ce"/>
    <rect x="132" y="80" width="30" height="22" rx="3" fill="#bee3f8"/><rect x="170" y="80" width="30" height="22" rx="3" fill="#bee3f8"/><rect x="208" y="80" width="30" height="22" rx="3" fill="#bee3f8"/>
    <circle cx="150" cy="134" r="9" fill="#2d3748"/><circle cx="245" cy="134" r="9" fill="#2d3748"/>
    <text x="150" y="35" text-anchor="middle" font-size="16" fill="#555">kl. 07.30 – i dag</text>
    <text x="150" y="168" text-anchor="middle" font-size="19" font-weight="700" fill="#c05621">Jag tog bussen i morse.</text>
  </g>
  <g transform="translate(360,40)">
    <rect width="300" height="180" rx="14" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
    <rect x="40" y="40" width="80" height="80" rx="8" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
    <rect x="40" y="40" width="80" height="20" fill="#2b6cb0"/>
    <text x="80" y="104" text-anchor="middle" font-size="30" font-weight="700" fill="#2b6cb0">+1</text>
    <rect x="150" y="70" width="120" height="50" rx="12" fill="#3182ce" opacity="0.5"/>
    <text x="150" y="30" text-anchor="middle" font-size="16" fill="#555">kl. 07.30 – nästa dag</text>
    <text x="150" y="168" text-anchor="middle" font-size="19" font-weight="700" fill="#2b6cb0">Jag tar bussen i morgon.</text>
  </g>
  <text x="340" y="262" text-anchor="middle" font-size="16" fill="#444">i morse = redan hänt (tog) · i morgon = har inte hänt än (tar / ska ta)</text>
</svg>
