<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif"><rect width="600" height="300" fill="#fff"/><rect x="40" y="70" width="200" height="140" rx="8" fill="#e8f1ff" stroke="#3a6fd8" stroke-width="3"/><path d="M40 70 L140 150 L240 70" fill="none" stroke="#3a6fd8" stroke-width="3"/><text x="140" y="245" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">Maria skriver</text><text x="140" y="268" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">Hur ser lägenheten ut?</text><path d="M260 140 L340 140" stroke="#666" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#666"/></marker></defs><rect x="360" y="80" width="200" height="130" rx="8" fill="#fff8e0" stroke="#d9a400" stroke-width="3"/><text x="460" y="115" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Ditt svar</text><text x="460" y="145" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">Hej Maria!</text><text x="460" y="168" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">… svar på alla frågor …</text><text x="460" y="191" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">Hälsningar, du</text><text x="460" y="245" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="bold">Svara på ALLA frågor</text><text x="300" y="35" font-size="24" fill="#222" text-anchor="middle" font-weight="bold">Svara på ett mejl</text></svg>
