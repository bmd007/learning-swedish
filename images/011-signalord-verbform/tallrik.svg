    <rect x="530" y="62" width="95" height="50" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2"/><text x="578" y="93" font-size="16" font-weight="700">igår</text>
    <ellipse cx="578" cy="170" rx="55" ry="20" fill="#edf2f7" stroke="#718096" stroke-width="2"/>
    <circle cx="565" cy="165" r="11" fill="#f6ad55"/><circle cx="592" cy="170" r="9" fill="#68d391"/>
    <text x="122" y="235" font-size="24" font-weight="700">Jag äter.</text>
