    <rect x="15" y="15" width="215" height="270" rx="10" fill="#fff" stroke="#cbd5e0" stroke-width="2"/>
    <rect x="242" y="15" width="215" height="270" rx="10" fill="#fff" stroke="#cbd5e0" stroke-width="2"/>
    <rect x="470" y="15" width="215" height="270" rx="10" fill="#fff" stroke="#cbd5e0" stroke-width="2"/>
    <text x="122" y="42" font-size="17" font-weight="700" fill="#22543d">Nu, klockan 12</text>
    <text x="350" y="42" font-size="17" font-weight="700" fill="#744210">Klockan 13</text>
    <text x="578" y="42" font-size="17" font-weight="700" fill="#9b2c2c">Igår</text>
    <ellipse cx="122" cy="150" rx="75" ry="30" fill="#edf2f7" stroke="#718096" stroke-width="3"/>
    <circle cx="105" cy="143" r="16" fill="#f6ad55"/><circle cx="140" cy="150" r="13" fill="#68d391"/><rect x="95" y="152" width="30" height="10" rx="4" fill="#e53e3e"/>
    <ellipse cx="350" cy="150" rx="75" ry="30" fill="#edf2f7" stroke="#718096" stroke-width="3"/>
