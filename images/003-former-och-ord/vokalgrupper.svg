<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif"><rect width="600" height="300" fill="#fff"/><text x="300" y="28" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">Starka verb: lär dig vokalgruppen</text><rect x="30" y="42" width="540" height="42" rx="8" fill="#e8f1ff" stroke="#888"/><text x="60" y="70" font-size="20" fill="#222" text-anchor="start" font-weight="bold">i – e – i</text><text x="240" y="70" font-size="18" fill="#222" text-anchor="start" font-weight="normal">skriva – skrev – skrivit</text><rect x="30" y="92" width="540" height="42" rx="8" fill="#fff0d6" stroke="#888"/><text x="60" y="120" font-size="20" fill="#222" text-anchor="start" font-weight="bold">i – a – u</text><text x="240" y="120" font-size="18" fill="#222" text-anchor="start" font-weight="normal">dricka – drack – druckit</text><rect x="30" y="142" width="540" height="42" rx="8" fill="#e6f6e6" stroke="#888"/><text x="60" y="170" font-size="20" fill="#222" text-anchor="start" font-weight="bold">y/ju – ö – u</text><text x="240" y="170" font-size="18" fill="#222" text-anchor="start" font-weight="normal">flyga – flög – flugit</text><rect x="30" y="192" width="540" height="42" rx="8" fill="#f5e6f7" stroke="#888"/><text x="60" y="220" font-size="20" fill="#222" text-anchor="start" font-weight="bold">a – o – a</text><text x="240" y="220" font-size="18" fill="#222" text-anchor="start" font-weight="normal">ta – tog – tagit</text><rect x="30" y="242" width="540" height="42" rx="8" fill="#fde4e4" stroke="#888"/><text x="60" y="270" font-size="20" fill="#222" text-anchor="start" font-weight="bold">ä – å – ä</text><text x="240" y="270" font-size="18" fill="#222" text-anchor="start" font-weight="normal">äta – åt – ätit</text><text x="300" y="295" font-size="16" fill="#555" text-anchor="middle" font-weight="normal">Supinum slutar oftast på -it</text></svg>
