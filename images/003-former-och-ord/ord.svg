<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif"><rect width="600" height="300" fill="#fff"/><rect x="30" y="50" width="250" height="190" rx="10" fill="#fff8e0" stroke="#d9a400" stroke-width="2"/><text x="155" y="85" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Vid jobbet</text><text x="155" y="120" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">bli uppsagd</text><text x="155" y="150" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">söka ett jobb</text><text x="155" y="180" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">vara tvungen att jobba</text><text x="155" y="210" font-size="16" fill="#555" text-anchor="middle" font-weight="normal">förmodligen = troligen</text><rect x="320" y="50" width="250" height="190" rx="10" fill="#e8f1ff" stroke="#3a6fd8" stroke-width="2"/><text x="445" y="85" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Vid tandläkaren</text><text x="445" y="120" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">avboka en tid</text><text x="445" y="150" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">påminna någon om tiden</text><text x="445" y="180" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">komma ihåg tiden</text><text x="445" y="210" font-size="16" fill="#555" text-anchor="middle" font-weight="normal">däremot = on the other hand</text><text x="300" y="275" font-size="18" fill="#555" text-anchor="middle" font-weight="normal">Viktiga ord i vardagen</text></svg>
