<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif"><rect width="600" height="300" fill="#fff"/><text x="300" y="28" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">Jämförelse: samma ord, olika steg</text><rect x="40" y="190" width="160" height="60" fill="#e8f1ff" stroke="#3a6fd8" stroke-width="2"/><text x="120" y="218" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">snabb</text><text x="120" y="242" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">vanligt: -are</text><rect x="220" y="140" width="160" height="110" fill="#e8f1ff" stroke="#3a6fd8" stroke-width="2"/><text x="300" y="168" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">stor → större</text><text x="300" y="192" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">ändrar vokal</text><rect x="400" y="90" width="160" height="160" fill="#e8f1ff" stroke="#3a6fd8" stroke-width="2"/><text x="480" y="118" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">bra → bättre</text><text x="480" y="142" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">oregelbundet</text><text x="300" y="285" font-size="18" fill="#555" text-anchor="middle" font-weight="normal">bok → böcker · fot → fötter · son → söner</text></svg>
