<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, Helvetica, Arial, sans-serif">
<rect width="600" height="300" fill="#ffffff"/>
<text x="300" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f4e79">Del 4: fyra inslag, sex rubriker</text>
<rect x="40" y="70" width="160" height="150" rx="14" fill="#e8f1fa" stroke="#1f4e79" stroke-width="3"/><text x="120" y="100" text-anchor="middle" font-size="18" fill="#222">Inslag 1–4</text><circle cx="120" cy="160" r="40" fill="#fff" stroke="#1f4e79" stroke-width="3"/><circle cx="120" cy="160" r="12" fill="#1f4e79"/><line x1="210" y1="145" x2="380" y2="145" stroke="#1f4e79" stroke-width="5"/><text x="295" y="135" text-anchor="middle" font-size="24" fill="#1f4e79">=</text><rect x="390" y="70" width="170" height="150" rx="10" fill="#eaf6ea" stroke="#2e7d32" stroke-width="3"/><text x="475" y="100" text-anchor="middle" font-size="18" fill="#222">Rubriker A–F</text><text x="475" y="150" text-anchor="middle" font-size="16" fill="#222">4 passar</text><text x="475" y="180" text-anchor="middle" font-size="16" fill="#b00020">2 blir över</text><text x="300" y="265" text-anchor="middle" font-size="16" fill="#222">Lyssna efter ämnet, inte efter enstaka ord</text>
