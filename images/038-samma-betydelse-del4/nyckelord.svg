<text x="34" y="269" font-size="20" fill="#222">På 1960-talet <tspan font-weight="bold" fill="#1e8449">växte städerna</tspan>. Många <tspan font-weight="bold" fill="#c0392b">flyttade från</tspan> landsbygden.</text>
<text x="20" y="318" font-size="17" fill="#222">lämnade = flyttade från  |  Tid och plats stämmer  →  välj meningen, inte 0</text>
