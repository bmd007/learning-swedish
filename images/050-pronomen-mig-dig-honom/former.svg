<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="600" height="300" fill="#ffffff"/><text x="300" y="36" font-size="24" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">Som I → me, he → him, we → us</text><text x="120" y="90" font-size="30" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">han</text><line x1="180" y1="80" x2="300" y2="80" stroke="#555" stroke-width="3" marker-end="url(#a)"/><text x="330" y="90" font-size="30" fill="#26a269" text-anchor="start" font-family="system-ui, sans-serif" font-weight="bold">honom</text><text x="450" y="90" font-size="22" fill="#26a269" text-anchor="start" font-family="system-ui, sans-serif">(him)</text><text x="120" y="140" font-size="30" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">hon</text><line x1="180" y1="130" x2="300" y2="130" stroke="#555" stroke-width="3" marker-end="url(#a)"/><text x="330" y="140" font-size="30" fill="#26a269" text-anchor="start" font-family="system-ui, sans-serif" font-weight="bold">henne</text><text x="450" y="140" font-size="22" fill="#26a269" text-anchor="start" font-family="system-ui, sans-serif">(her)</text><text x="120" y="190" font-size="30" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">vi</text><line x1="180" y1="180" x2="300" y2="180" stroke="#555" stroke-width="3" marker-end="url(#a)"/><text x="330" y="190" font-size="30" fill="#26a269" text-anchor="start" font-family="system-ui, sans-serif" font-weight="bold">oss</text><text x="450" y="190" font-size="22" fill="#26a269" text-anchor="start" font-family="system-ui, sans-serif">(us)</text><text x="120" y="240" font-size="30" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">ni</text><line x1="180" y1="230" x2="300" y2="230" stroke="#555" stroke-width="3" marker-end="url(#a)"/><text x="330" y="240" font-size="30" fill="#26a269" text-anchor="start" font-family="system-ui, sans-serif" font-weight="bold">er</text><text x="450" y="240" font-size="22" fill="#26a269" text-anchor="start" font-family="system-ui, sans-serif">(you, plural)</text><text x="120" y="290" font-size="30" fill="#1a5fb4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">de</text><line x1="180" y1="280" x2="300" y2="280" stroke="#555" stroke-width="3" marker-end="url(#a)"/><text x="330" y="290" font-size="30" fill="#26a269" text-anchor="start" font-family="system-ui, sans-serif" font-weight="bold">dem</text><text x="450" y="290" font-size="22" fill="#26a269" text-anchor="start" font-family="system-ui, sans-serif">(them)</text></svg>