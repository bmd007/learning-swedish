<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="600" height="300" fill="#ffffff"/><text x="300" y="34" font-size="22" fill="#222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold">hans – hennes – deras: aldrig någon ändelse</text><circle cx="80" cy="70" r="16" fill="#fde9c9" stroke="#333" stroke-width="2"/><line x1="80" y1="86" x2="80" y2="140" stroke="#333" stroke-width="4"/><line x1="80" y1="140" x2="64" y2="180" stroke="#333" stroke-width="4"/><line x1="80" y1="140" x2="96" y2="180" stroke="#333" stroke-width="4"/><line x1="56" y1="110" x2="104" y2="110" stroke="#333" stroke-width="4"/><text x="200" y="130" font-size="26" fill="#1a5fb4" text-anchor="start" font-family="system-ui, sans-serif" font-weight="bold">hans bil</text><text x="200" y="170" font-size="26" fill="#1a5fb4" text-anchor="start" font-family="system-ui, sans-serif" font-weight="bold">hans hus</text><text x="200" y="210" font-size="26" fill="#1a5fb4" text-anchor="start" font-family="system-ui, sans-serif" font-weight="bold">hans barn</text><circle cx="400" cy="70" r="16" fill="#fde9c9" stroke="#7a3b8f" stroke-width="2"/><line x1="400" y1="86" x2="400" y2="140" stroke="#7a3b8f" stroke-width="4"/><line x1="400" y1="140" x2="384" y2="180" stroke="#7a3b8f" stroke-width="4"/><line x1="400" y1="140" x2="416" y2="180" stroke="#7a3b8f" stroke-width="4"/><line x1="376" y1="110" x2="424" y2="110" stroke="#7a3b8f" stroke-width="4"/><text x="480" y="130" font-size="26" fill="#7a3b8f" text-anchor="start" font-family="system-ui, sans-serif" font-weight="bold">hennes bil</text><text x="480" y="170" font-size="26" fill="#7a3b8f" text-anchor="start" font-family="system-ui, sans-serif" font-weight="bold">hennes hus</text><text x="480" y="210" font-size="26" fill="#7a3b8f" text-anchor="start" font