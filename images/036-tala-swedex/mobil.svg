<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, sans-serif"><rect width="600" height="300" fill="#fff"/><rect x="250" y="30" width="100" height="200" rx="14" fill="#333"/><rect x="260" y="50" width="80" height="150" fill="#9ad0ff"/><rect x="40" y="60" width="190" height="130" rx="10" fill="#dff3df" stroke="#2a7a2a" stroke-width="2"/><text x="135" y="90" font-size="20" fill="#2a7a2a" text-anchor="middle" font-weight="bold">Fördelar</text><text x="135" y="125" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">nära familjen</text><text x="135" y="150" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">snabb information</text><text x="135" y="175" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">kartor, banken</text><rect x="370" y="60" width="190" height="130" rx="10" fill="#fde4e4" stroke="#c0392b" stroke-width="2"/><text x="465" y="90" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="bold">Nackdelar</text><text x="465" y="125" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">stress, sömn</text><text x="465" y="150" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">mindre tid ihop</text><text x="465" y="175" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">tittar hela tiden</text><text x="300" y="265" font-size="18" fill="#555" text-anchor="middle" font-weight="normal">Å ena sidan … å andra sidan …</text></svg>
