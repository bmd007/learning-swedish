<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" font-family="system-ui, sans-serif"><rect width="700" height="220" fill="#fff"/>
<text x="350" y="28" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Det är den 13 mars (torsdag) = IDAG</text>
<rect x="20" y="50" width="200" height="100" rx="10" fill="#ffe3cc"/><text x="120" y="78" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Före idag</text><text x="120" y="102" font-size="15" text-anchor="middle" fill="#222">preteritum</text><text x="120" y="126" font-size="15" text-anchor="middle" fill="#222">åkte, var, åt, såg</text>
<rect x="250" y="50" width="200" height="100" rx="10" fill="#fff3b0"/><text x="350" y="78" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Idag</text><text x="350" y="102" font-size="15" text-anchor="middle" fill="#222">presens</text><text x="350" y="126" font-size="15" text-anchor="middle" fill="#222">jag har, jag är</text>
<rect x="480" y="50" width="200" height="100" rx="10" fill="#e6f6e6"/><text x="580" y="78" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Efter idag</text><text x="580" y="102" font-size="15" text-anchor="middle" fill="#222">ska + infinitiv</text><text x="580" y="126" font-size="15" text-anchor="middle" fill="#222">kommer att + infinitiv</text>
<text x="120" y="180" font-size="15" text-anchor="middle" fill="#666">igår, i tisdags</text><text x="350" y="180" font-size="15" text-anchor="middle" fill="#666">idag, just nu</text><text x="580" y="180" font-size="15" text-anchor="middle" fill="#666">i morgon, på lördag</text>
<text x="350" y="208" font-size="16" text-anchor="middle" fill="#222">Välj 5 av 7 dagar. Berätta + tyck något.</text></svg>