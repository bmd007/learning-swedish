<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">3 frågor före adjektivet</text>
  <rect x="20" y="50" width="190" height="90" rx="12" fill="#d6eaf8"/>
  <text x="115" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a5276">1. en eller ett?</text>
  <text x="115" y="108" text-anchor="middle" font-size="16" fill="#1a5276">en lägenhet → min</text>
  <text x="115" y="128" text-anchor="middle" font-size="16" fill="#1a5276">ett hem → mitt</text>
  <path d="M212 95 h26 l-8 -8 m8 8 l-8 8" stroke="#555" stroke-width="3" fill="none"/>
  <rect x="225" y="50" width="190" height="90" rx="12" fill="#fcf3cf"/>
  <text x="320" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="#7d6608">2. min/mitt/den/det</text>
  <text x="320" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#7d6608">före adjektivet?</text>
  <text x="320" y="128" text-anchor="middle" font-size="16" fill="#7d6608">JA → alltid -a</text>
  <path d="M417 95 h26 l-8 -8 m8 8 l-8 8" stroke="#555" stroke-width="3" fill="none"/>
  <rect x="430" y="50" width="190" height="90" rx="12" fill="#fadbd8"/>
  <text x="525" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="#922b21">3. NEJ</text>
  <text x="525" y="104" text-anchor="middle" font-size="16" fill="#922b21">en: – (en gammal)</text>
  <text x="525" y="124" text-anchor="middle" font-size="16" fill="#922b21">ett: -t · plural: -a</text>
  <text x="320" y="185" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e8449">mitt nya hem · min gamla lägenhet · mitt förra kök</text>
  <text x="320" y="225" text-anchor="middle" font-size="18" fill="#444">ett nytt hem (ingen mitt → -t)</text>
  <text x="320" y="260" text-anchor="middle" font-size="18" fill="#444">mitt eget kök · ett rum på 20 kvadratmeter</text>
</svg>
