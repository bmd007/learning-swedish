<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, Helvetica, Arial, sans-serif">
<rect width="600" height="300" fill="#ffffff"/>
<text x="300" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f4e79">Samma sak, andra ord</text>
<rect x="30" y="70" width="230" height="70" rx="10" fill="#e8f1fa" stroke="#1f4e79" stroke-width="3"/>
<text x="145" y="100" text-anchor="middle" font-size="18" fill="#222">Fråga:</text>
<text x="145" y="126" text-anchor="middle" font-size="18" fill="#222">"Man blir sjuk färre gånger"</text>
<rect x="340" y="70" width="230" height="70" rx="10" fill="#eaf6ea" stroke="#2e7d32" stroke-width="3"/>
<text x="455" y="100" text-anchor="middle" font-size="18" fill="#222">Text (mening 6):</text>
<text x="455" y="126" text-anchor="middle" font-size="18" fill="#222">"sjuk mer sällan"</text>
<line x1="265" y1="105" x2="335" y2="105" stroke="#1f4e79" stroke-width="5"/>
<text x="300" y="95" text-anchor="middle" font-size="26" fill="#1f4e79">=</text>
<text x="300" y="185" text-anchor="middle" font-size="18" fill="#222">1. Hitta ett ord som inte kan bytas ut (sjuk)</text>
<text x="300" y="215" text-anchor="middle" font-size="18" fill="#222">2. Läs den meningen. Är det samma sak?</text>
<text x="300" y="245" text-anchor="middle" font-size="18" fill="#222">3. Välj 0 först efter två sökord utan träff</text>
<text x="300" y="280" text-anchor="middle" font-size="16" fill="#b00020">men = اما / ولی : läs delen efter "men"!</text>
</svg>
